name: Auto Refresh Pages Cache

on:
  push:
    paths:
      - 'data.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log Data Update
        run: |
          echo "data.json was updated!"
          echo "Static website content refreshed successfully."
